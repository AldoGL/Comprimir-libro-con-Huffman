<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compresión Huffman</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Compresor de Texto - Huffman</h1>
        
        <div class="input-section">
            <label for="input-text">Ingresa el texto a comprimir:</label>
            <textarea id="input-text" rows="6" placeholder="Escribe o pega tu texto aquí..."></textarea>
            <button id="btn-comprimir">Comprimir Texto</button>
        </div>

        <div class="results-section" id="results-section" style="display: none;">
            <h2>Resultados de Compresión</h2>
            
            <div class="stats-cards">
                <div class="card">
                    <h3>Tamaño Original</h3>
                    <p id="tamano-original">0 bytes</p>
                </div>
                <div class="card">
                    <h3>Tamaño Codificado</h3>
                    <p id="tamano-codificado">0 bytes</p>
                </div>
                <div class="card destacada">
                    <h3>Compresión</h3>
                    <p id="porcentaje-compresion">0%</p>
                </div>
            </div>

            <div class="details">
                <h3>Verificación de Integridad</h3>
                <p id="status-integridad" class="status-box"></p>

                <h3>Texto Codificado (Bits)</h3>
                <textarea id="texto-codificado" rows="4" readonly></textarea>

                <h3>Texto Descomprimido</h3>
                <textarea id="texto-descomprimido" rows="4" readonly></textarea>
            </div>
        </div>
    </div>

    <script src="huffman.js"></script>
</body>
</html>
